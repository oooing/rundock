name: Clean RunDock Temporary Artifacts

on:
  workflow_run:
    workflows: [RunDock release]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: rundock-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only execute trusted default-branch code, never code/artifacts from the triggering run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify cleanup safeguards
        run: node --test scripts/tests/artifact-cleanup.test.mjs
      - name: Clean completed release artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { cleanupArtifacts } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/artifact-cleanup.mjs`);
            await cleanupArtifacts({ github, context, core });
