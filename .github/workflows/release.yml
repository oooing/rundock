name: RunDock release
run-name: ${{ inputs.release_run_id && format('rundock:{0}:{1}', inputs.release_run_id, inputs.target_id) || 'RunDock manual validation' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Frozen release tag; empty runs source validation only
        type: string
      release_commit:
        description: Frozen commit SHA
        type: string
      release_run_id:
        description: RunDock operation ID
        type: string
      target_id:
        description: RunDock target ID
        type: string
      source_only:
        description: 'Dry-run only: validate source without building installers'
        required: true
        type: boolean
        default: false

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.plan.outputs.tag_name }}
      target_version: ${{ steps.plan.outputs.target_version }}
      source_only: ${{ steps.plan.outputs.source_only }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      publishes_release: ${{ steps.plan.outputs.publishes_release }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for version validation
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test release scripts without publishing
        run: npm run test:release

      - name: Test artifact cleanup safeguards
        run: node --test scripts/tests/artifact-cleanup.test.mjs

      - name: Parse and validate the release plan
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_SOURCE_ONLY: ${{ inputs.source_only }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          TARGET_ID: ${{ inputs.target_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG) {
            $tagName = $env:RELEASE_TAG
            if ($env:REF_NAME -cne $tagName -or $env:RELEASE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:RELEASE_RUN_ID -notmatch '^[A-Za-z0-9_.-]+$' -or $env:TARGET_ID -cne 'windows') { throw 'Invalid RunDock dispatch identity.' }
            # checkout with fetch-depth: 0 already fetched all branches and tags.
            # Do not fetch again: credentials are deliberately not persisted.
            git show-ref --verify --quiet refs/remotes/origin/master
            if ($LASTEXITCODE -ne 0) { throw 'The checkout does not contain origin/master.' }
            $tagCommit = (git rev-list -n 1 "refs/tags/$tagName").Trim()
            if (-not $tagCommit) { throw "Unable to resolve tag $tagName." }
            $checkedOutCommit = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -ne $tagCommit -or $tagCommit -cne $env:RELEASE_COMMIT) {
              throw "Checked-out commit does not match tag $tagName."
            }
            git merge-base --is-ancestor $tagCommit refs/remotes/origin/master
            if ($LASTEXITCODE -ne 0) { throw "Tag $tagName is not on the master branch." }
            ./scripts/release-plan.ps1 -TagName $tagName -OutputDirectory release-plan -ValidateLauncherVersion
          } else {
            if ($env:REF_NAME -ne 'master') { throw 'A dry-run must be started from the master branch.' }
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $sourceOnly = $env:DRY_RUN_SOURCE_ONLY -eq 'true'
            ./scripts/release-plan.ps1 -TagName "v$version" -OutputDirectory release-plan -DryRun -SourceOnly:$sourceOnly -ValidateLauncherVersion
          }

          $plan = Get-Content release-plan/release-plan.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -and (@($plan.targetIds).Count -ne 1 -or $plan.targetIds[0] -cne $env:TARGET_ID)) {
            throw 'The frozen plan does not authorize this cloud target.'
          }
          @(
            "### Release plan"
            "- Tag: ``$($plan.tagName)``"
            "- Dry-run: ``$($plan.dryRun)``"
            "- Source only: ``$($plan.sourceOnly)``"
            "- Build Windows: ``$($plan.buildWindows)``"
            "- Publish GitHub Release: ``$($plan.publishesRelease)``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Save the validated plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ steps.plan.outputs.tag_name }}
          path: release-plan/
          if-no-files-found: error
          retention-days: 1

  build_windows:
    name: Build Windows installers
    needs: prepare
    if: needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out the release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/go.mod
          cache: true
          cache-dependency-path: sidecar/go.sum

      - name: Select the tested Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup default 1.93.1
          rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Ensure Windows Installer service is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $service = Get-Service -Name msiserver -ErrorAction Stop
            if ($service.StartType -eq 'Disabled') {
              Set-Service -Name msiserver -StartupType Manual
              $service = Get-Service -Name msiserver -ErrorAction Stop
            }

            if ($service.Status -ne 'Running') {
              Start-Service -Name msiserver -ErrorAction Stop
              $service.WaitForStatus(
                [System.ServiceProcess.ServiceControllerStatus]::Running,
                [TimeSpan]::FromSeconds(30)
              )
            }

            $service.Refresh()
            if ($service.Status -ne 'Running') {
              throw "Service did not reach the Running state within 30 seconds (current: $($service.Status))."
            }
            Write-Host "Windows Installer service is running (startup type: $($service.StartType))."
          } catch {
            Write-Error "Windows Installer service (msiserver) is unavailable; MSI packaging cannot continue. $($_.Exception.Message)"
            exit 1
          }

      - name: Test and build NSIS/MSI
        shell: pwsh
        run: ./scripts/release-build.ps1 -TagName '${{ needs.prepare.outputs.tag_name }}' -OutputDirectory release-assets -InstallDependencies

      - name: Save database upgrade acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-upgrade-${{ needs.prepare.outputs.tag_name }}
          path: outputs/acceptance/schema-upgrade-*/
          if-no-files-found: ignore
          retention-days: 1

      - name: Save installers for publishing or dry-run inspection
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-${{ needs.prepare.outputs.tag_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build_windows
    if: >-
      always() &&
      inputs.release_tag != '' &&
      needs.prepare.result == 'success' &&
      (needs.build_windows.result == 'success' || needs.build_windows.result == 'skipped') &&
      needs.prepare.outputs.publishes_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore release notes and plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ needs.prepare.outputs.tag_name }}
          path: release-plan

      - name: Restore Windows installers
        if: needs.prepare.outputs.build_windows == 'true'
        uses: actions/download-artifact@v4
        with:
          name: launcher-windows-${{ needs.prepare.outputs.tag_name }}
          path: release-assets

      - name: Create or resume the draft, then publish it
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ONLY: ${{ needs.prepare.outputs.source_only }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceOnly = $env:SOURCE_ONLY -eq 'true'
          ./scripts/publish-github-release.ps1 `
            -TagName $env:RELEASE_TAG `
            -NotesFile release-plan/release-notes.md `
            -AssetDirectory release-assets `
            -SourceOnly:$sourceOnly

      - name: Add Release link to the run summary
        shell: pwsh
        run: '"Published: ${{ steps.release.outputs.release_url }}" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY'
