[package]
name = "launcher-platform"
version = "0.1.0"
description = "Windows AI 启动平台 — 拖入 start.bat 即可托管"
authors = ["Launcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "launcher_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
